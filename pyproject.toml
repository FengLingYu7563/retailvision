[project]
name = "retailvision"
version = "0.1.0"
description = "零售商品影像辨識服務（作品集專案）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "onnxruntime>=1.18",
    "joblib>=1.3",
]

[project.optional-dependencies]
# 訓練環境才需要 PyTorch / Ultralytics，推論與 API 只用 ONNX Runtime
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "timm>=1.0",  # DINOv2-small backbone（v2 分類 / embedding 模型）
    "onnx>=1.16",
    "onnxscript>=0.1",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["vision*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["training/data/raw"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# 影像程式慣用 X / H / W 這類大寫變數；PyTorch 慣用 import torch.nn.functional as F
ignore = ["N806", "N803", "N812"]

[tool.mypy]
python_version = "3.11"
files = ["vision"]
strict = true
ignore_missing_imports = true
# cv2 沒有完整型別資訊，回傳值多半是 Any
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "needs_weights: 需要本機訓練出的權重與 torch，CI 自動 skip",
    "needs_data: 需要本機下載的資料集，CI 自動 skip",
    "needs_detector: 需要 ultralytics、偵測模型 ONNX 與 SKU-110K，CI 自動 skip",
]
