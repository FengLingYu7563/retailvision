# 反向代理（Phase 3 調整第 8 點）：唯一對外開放的服務。
# /api、/docs、/openapi.json、/healthz -> API；其他 -> Streamlit 儀表板。
# client_max_body_size 是上傳大小的第二道防線：API 的 middleware 已經會擋，
# 但在 nginx 就擋下來，超大請求連 API 容器都不會碰到。

upstream api {
    server api:8000;
}

upstream dashboard {
    server dashboard:8501;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_tokens off;

    # 預設上限：單張上傳 10 MB + multipart 開銷
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 用 $remote_addr 覆蓋（不是附加）：client 自己帶的 X-Forwarded-For 不能用來偽造 IP 躲過限流
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $request_id always;

    # nginx 自己產生的錯誤（上傳超過 client_max_body_size、API 掛掉）也用 API 的統一錯誤格式，
    # 帶同一個 request_id；否則 client 會收到 nginx 預設的 HTML 頁面
    error_page 413 @too_large;
    error_page 502 503 504 =503 @upstream_unavailable;

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"請求超過上傳大小上限","request_id":"$request_id"}}';
    }

    location @upstream_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"服務暫時無法使用","request_id":"$request_id"}}';
    }

    # 批次：總量上限 100 MB（和 API 的 MAX_BATCH_BYTES 一致）
    location = /api/v1/recognitions/batch {
        client_max_body_size 101m;
        proxy_pass http://api;
        proxy_read_timeout 120s;
    }

    # 新品登錄：最多 5 張參考圖
    location = /api/v1/catalog/products {
        client_max_body_size 52m;
        proxy_pass http://api;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi\.json|healthz)$ {
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://dashboard;
        # Streamlit 用 WebSocket 傳資料
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
