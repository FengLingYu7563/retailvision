# RetailVision 全部服務（驗收 3.1）：
#   cp .env.example .env    # 填入 POSTGRES_PASSWORD、JWT_SECRET、ADMIN_PASSWORD（範例檔刻意留空）
#   docker compose up -d --build
#   開啟 http://localhost:8080（儀表板）、http://localhost:8080/docs（API 文件）
#
# 對外只開 nginx（Phase 3 調整第 8 點），其他服務都不對 host 開埠。兩個網路：
#   backend（internal，不能連外網）：db、redis、api、worker、nginx
#   frontend：nginx、dashboard、camera
# dashboard 與 camera 連不到 api，只能經過 nginx；api 只信任 nginx 固定 IP 帶來的 X-Forwarded-For。
# 本機開發要從 host 連 db / redis（跑 pytest、CLI）時另外疊加 docker-compose.dev.yml。
# 權重檔不在 git 裡：models/ 底下要先放好 .onnx（訓練產出），沒放時 /healthz 會回 503 並指出缺哪個模型。

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-retailvision}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?請在 .env 設定 JWT_SECRET}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  STORAGE_DIR: /data/storage
  MODELS_DIR: /srv/models

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-retailvision}
    networks: [backend]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-retail}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: retailvision/api:latest
    command: ["api"]
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FORWARDED_ALLOW_IPS: ${NGINX_BACKEND_IP:-172.30.57.10}
    networks: [backend]
    volumes:
      - ${MODELS_HOST_DIR:-./models}:/srv/models:ro
      - storage:/data/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    # 和 api 同一個映像檔（同樣的程式與依賴），只是啟動指令不同
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: retailvision/api:latest
    command: ["worker"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    networks: [backend]
    volumes:
      - ${MODELS_HOST_DIR:-./models}:/srv/models:ro
      - storage:/data/storage
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME -t 5 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: retailvision/dashboard:latest
    environment:
      # 經過 nginx，不直接連 api（api 不在 frontend 網路上）
      API_BASE: http://nginx
    networks: [frontend]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      frontend: {}
      backend:
        # 固定 IP：api 只信任這個位址帶來的 X-Forwarded-For
        ipv4_address: ${NGINX_BACKEND_IP:-172.30.57.10}
    depends_on:
      api: {condition: service_healthy}
      dashboard: {condition: service_started}
    restart: unless-stopped

  # 模擬相機（驗收 3.4）：把圖片丟進 ./camera_inbox，就會自動送去辨識。
  # 選用：docker compose --profile camera up -d
  camera:
    profiles: ["camera"]
    image: retailvision/dashboard:latest
    command: ["python", "-m", "tools.camera_sim", "--watch", "/srv/camera_inbox"]
    environment:
      API_BASE: http://nginx
      CAMERA_TYPE: ${CAMERA_TYPE:-product}
      CAMERA_USERNAME: ${CAMERA_USERNAME:-${ADMIN_USERNAME:-}}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:-${ADMIN_PASSWORD:-}}
    volumes:
      - ./tools:/srv/tools:ro
      - ./camera_inbox:/srv/camera_inbox
    networks: [frontend]
    depends_on:
      nginx: {condition: service_started}
    restart: unless-stopped

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.57.0/24}
  frontend: {}

volumes:
  pgdata:
  storage:
